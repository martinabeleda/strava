services:
  llm-stub:
    build:
      context: ./
      network: host
    network_mode: host
    command:
      - python
      - "-m"
      - uvicorn
      - "strava.testing.openai_stub:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "18090"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:18090/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  db:
    image: postgis/postgis:17-3.5
    network_mode: host
    command: ["postgres", "-p", "15433"]
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p 15433"]
      interval: 5s
      timeout: 5s
      retries: 5

  migration:
    build:
      context: ./
      network: host
    network_mode: host
    command:
      - alembic
      - upgrade
      - head
    environment:
      - PROJECT_NAME=strava-test
      - ENVIRONMENT=${ENVIRONMENT:-test}
      - LOGFIRE_TOKEN=${LOGFIRE_TOKEN}
      - POSTGRES_SERVER=localhost:15433
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=test
    depends_on:
      db:
        condition: service_healthy

  service:
    build:
      context: ./
      network: host
    network_mode: host
    command:
      - python
      - "-m"
      - uvicorn
      - "strava.main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "18081"
    environment:
      - PROJECT_NAME=strava-test
      - ENVIRONMENT=${ENVIRONMENT:-test}
      - LOGFIRE_TOKEN=${LOGFIRE_TOKEN}
      - OPENAI_API_KEY=test-key
      - OPENAI_BASE_URL=http://localhost:18090/v1
      - POSTGRES_SERVER=localhost:15433
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=test
    depends_on:
      llm-stub:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:18081/ready || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10
