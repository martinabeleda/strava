services:
  llm-stub:
    build: ./
    command:
      - python
      - "-m"
      - uvicorn
      - "strava.testing.openai_stub:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8090"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8090/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  db:
    image: postgis/postgis:17-3.5
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=test
    ports:
      - 5433:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  migration:
    build: ./
    command:
      - alembic
      - upgrade
      - head
    environment:
      - PROJECT_NAME=strava-test
      - ENVIRONMENT=${ENVIRONMENT:-test}
      - LOGFIRE_TOKEN=${LOGFIRE_TOKEN}
      - POSTGRES_SERVER=db:5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=test
    links:
      - db
    depends_on:
      db:
        condition: service_healthy

  service:
    build: ./
    environment:
      - PROJECT_NAME=strava-test
      - ENVIRONMENT=${ENVIRONMENT:-test}
      - LOGFIRE_TOKEN=${LOGFIRE_TOKEN}
      - OPENAI_API_KEY=test-key
      - OPENAI_BASE_URL=http://llm-stub:8090/v1
      - POSTGRES_SERVER=db:5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=test
    ports:
      - 8081:8080
    depends_on:
      llm-stub:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ready || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10
